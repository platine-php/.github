name: Update Actions Dashboard

on:
  workflow_dispatch: # Manual trigger
  #schedule:
    #- cron: '*/15 * * * *' 

permissions:
  contents: write
  actions: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          #cache: 'pip'

      - name: Install dependencies
        run: |
          pip install PyGithub

      - name: Generate final README from template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os
          import github
          from github import Github
          from datetime import datetime
          
          # Initialize GitHub client
          auth = github.Auth.Token(os.environ['GITHUB_TOKEN'])
          g = Github(auth=auth)
          org_name = "platine-php"
          org = g.get_organization(org_name)
          
          # Build the dashboard content
          dashboard = "| Repository | Workflow | Status | Last Run |\n"
          dashboard += "|------------|----------|--------|----------|\n"
          repos = sorted(org.get_repos(), key=lambda r: r.name.lower())
          for repo in repos:
              print(repo)
              workflows = repo.get_workflows()
              for workflow in workflows:
                  print(workflow)
                  runs = workflow.get_runs(status='completed')
                  if runs.totalCount > 0:
                      latest_run = runs[0]
                      print(latest_run)
                      status = latest_run.conclusion.lower()
                      
                      if status == 'success':
                          badge = f"![Success](https://img.shields.io/badge/Success-brightgreen)"
                      elif status == 'failure':
                          badge = f"![Failure](https://img.shields.io/badge/Failure-red)"
                      else:
                          badge = f"![{status.capitalize()}](https://img.shields.io/badge/{status.capitalize()}-yellow)"
                      
                      last_run_time = latest_run.created_at.strftime("%Y-%m-%d %H:%M:%S")
                      dashboard += f"| [{repo.name}]({repo.html_url}) | {workflow.name} | {badge} | {last_run_time} |\n"
          
          dashboard += f"\n\n*Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} UTC*"
          
          with open('profile/README.template.md', 'r') as f:
              template_content = f.read()

          final_readme = template_content.replace('[DASHBOARD_CONTENT]', dashboard)

          with open('profile/README.md', 'w') as f:
              f.write(final_readme)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile/README.md
          git diff --staged --quiet || git commit -m "Update Actions dashboard [skip ci]"
          git push
